{% extends 'base.html' %}

{% block title %} Delete {{ object.name }} | Flint {% endblock %}

{% block content %}
<main class="max-w-7xl mx-auto px-4 py-8">
    <h1 class="text-2xl font-bold text-flint-text mb-8">Delete {{ object.name }}</h1>
    <div class="flex flex-col gap-4">
        <div class="bg-flint-card rounded-lg border border-flint-border p-6">
            <p class="text-lg font-semibold text-flint-text">Are you sure you want to delete "{{ object.name }}"?</p>
            <p class="text-sm text-flint-muted">This action cannot be undone.</p>
        </div>
        <form method="post" class="flex gap-3 mt-6">
            {% csrf_token %}
            <a href="{% url 'sources:detail' object.pk %}" class="border border-flint-border text-flint-muted hover:bg-flint-card px-4 py-2 rounded-md">Cancel</a>
            <button type="submit" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-md">Delete</button>
        </form>
    </div>
</main>
{% endblock content %}
