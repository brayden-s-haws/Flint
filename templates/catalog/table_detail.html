{% extends 'base.html' %}

{% block title %} {{ table.name }} | Flint {% endblock %}

{% block content %}
<main class="max-w-7xl mx-auto px-4 py-8">
    <div class="flex row, space-between, items-center, mb-8">
        <a class="text-sm text-flint-muted hover:text-flint-text" href="{% url 'catalog:list' %}">← Catalog</a>
        <h1 class="text-2xl font-bold text-flint-text">{{ object.name }}</h1>
        <p class="text-sm text-flint-muted">{{ object.schema.name }} · {{ object.schema.source.name }}"</p>
    </div>
    <div>


    </div>

</main>
<!-- TODO(stub): Wrap everything in <main class="max-w-7xl mx-auto px-4 py-8"> — consistent with
     source_detail.html and table_list.html. -->

    <!-- TODO(stub): Page header — flex row, space-between, items-center, mb-8.
         Left side:
           - Breadcrumb above the title: a small back-link to {% url 'catalog:list' %} with
             text "← Catalog", styled text-sm text-flint-muted hover:text-flint-text.
             This gives users a way back to the table list without using the browser back button.
           - <h1> with {{ object.name }}, styled text-2xl font-bold text-flint-text
           - Subtitle line with schema and source context:
             "{{ object.schema.name }} · {{ object.schema.source.name }}"
             styled text-sm text-flint-muted
         Right side: no action buttons for now (insights generation comes in the insights app) -->

    <!-- TODO(stub): Table metadata card — bg-flint-card rounded-lg border border-flint-border p-6 mb-6
         Show key facts about this table:
           - Table type: {{ object.table_type }} (e.g. "BASE TABLE", "VIEW")
           - Row count: {{ object.row_count|default:"Unknown" }}
         Label each with a muted key and a brighter value, similar to how source_detail.html
         shows "Source type:" and "Last synced:". -->

    <!-- TODO(stub): Columns section — another bg-flint-card card, below the metadata card.
         Header: <h2> "Columns" styled text-lg font-semibold text-flint-text mb-4

         The `columns` context variable (from get_context_data) is a queryset of Column objects,
         ordered by name. Each Column has: name, data_type, nullable (bool), primary_key (bool).

         Render as an HTML <table> — this is tabular data, so a proper <table> element is
         semantically correct and accessible. Use the same table pattern as the Sync History
         table in source_detail.html:
           - <thead> with columns: Name, Type, Nullable, Primary Key
           - <tbody> with {% for column in columns %} rows
           - Style th: text-flint-muted text-left text-sm font-medium pb-3
           - Style tr: border-t border-flint-border text-sm text-flint-text
           - Style td: py-3 pr-4
         For nullable and primary_key (booleans), show a checkmark or dash rather than
         "True"/"False" — use Django's `yesno` filter:
         {{ column.nullable|yesno:"Yes,No" }} -->

    <!-- TODO(stub): Insights section — another bg-flint-card card, below the columns section.
         Header: <h2> "Insights" styled text-lg font-semibold text-flint-text mb-4

         The `insights` context variable is currently an empty queryset (placeholder until
         the insights app is built). Show an empty state message for now:
         "No insights generated yet." styled text-sm text-flint-muted

         When the insights app is built, this section will loop over insights and render them.
         For now the placeholder is sufficient. -->

{% endblock content %}
