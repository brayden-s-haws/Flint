<nav class="bg-flint-surface border-b border-flint-border w-full">
    <div class="flex justify-between items-center px-4 py-2.5 max-w-7xl mx-auto">
        <div>
            <a class="flex items-center px-4" href="{% url 'core:dashboard' %}">
                <span class="text-xl font-bold text-flint-text tracking-tight">Flint</span>
            </a>
        </div>
        <div class="flex items-center">
            {% if request.user.is_authenticated %}
                <a class="text-sm font-medium text-flint-muted hover:text-flint-text mr-6" href="{% url 'sources:list' %}">Sources</a>
                <a class="text-sm font-medium text-flint-muted hover:text-flint-text mr-6" href="{% url 'catalog:list' %}">Catalog</a>
                <a class="text-sm font-medium text-flint-muted hover:text-flint-text mr-6" href="{% url 'insights:list' %}">Insights</a>
                <form action="{% url 'users:logout' %}" method="post">
                    {% csrf_token %}
                    <button class="bg-transparent border-none cursor-pointer text-sm font-medium text-flint-muted hover:text-flint-text" type="submit">Logout</button>
                </form>
            {% else %}
                <a class="text-sm font-medium text-flint-muted hover:text-flint-text mr-6" href="{% url 'users:register' %}">Register</a>
                <a class="bg-flint-orange text-white px-4 py-2 rounded-md text-sm font-medium hover:bg-flint-orange-hover" href="{% url 'users:login' %}">Login</a>
            {% endif %}
        </div>
    </div>
</nav>
